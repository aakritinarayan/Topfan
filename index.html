<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Desktop-first layout (min-width 1100px): on phones, lay out at the reference laptop width and
      // let the browser fit it to the screen, instead of opening the page and AI panel off-screen.
      if (Math.min(screen.width, screen.height) < 1100 && screen.width < 1100)
        document.querySelector('meta[name="viewport"]').setAttribute("content", "width=1126");
    </script>
    <link rel="icon" href="/favicon.svg" />
    <title>AJ White · TopFan</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
